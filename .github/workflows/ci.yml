name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: hbserve --version
      - run: hbserve capabilities
      - run: python -B tests/test_hbserve.py
      - run: python -B tests/test_windows.py
      - run: python -B tests/test_session_compatibility.py
